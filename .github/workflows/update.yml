name: Update objects

on:
  issues:
    types: [opened, closed, reopened, edited, deleted, labeled, unlabeled]
  workflow_dispatch: {}

permissions:
  contents: write
  issues: read

# Two runs regenerating api.json at once means all but one fail to push. The
# books repo lost an update that way, so runs queue instead of racing, and the
# push rebases in case the first run landed while this one was working.
concurrency:
  group: update-materials
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: node --test test.mjs

      - name: Build api.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node index.mjs

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api.json
          git diff --cached --quiet && echo "nothing changed" && exit 0
          git commit -m "Update objects [skip ci]"
          git pull --rebase --autostash
          git push
